version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: stock-buddy-postgres
    environment:
      POSTGRES_DB: stockbuddy
      POSTGRES_USER: stockbuddy
      POSTGRES_PASSWORD: stockbuddy
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockbuddy -d stockbuddy']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - stock-buddy-net

  stock-buddy-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-buddy-mcp:latest
    container_name: stock-buddy-mcp
    ports:
      - '8080:8080'
    environment:
      - STOCK_BUDDY_HTTP=1
      - STOCK_BUDDY_PORT=8080
      - STOCK_BUDDY_SKILLS_DIR=/app/skills
      - DATABASE_URL=postgresql://stockbuddy:stockbuddy@postgres:5432/stockbuddy
      - STOCK_BUDDY_PERSIST_ANALYSIS=1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Live repo skills (read for analysis; same mount used by skill editor sync_to_disk)
      - ./skills:/app/skills
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.exit(0)']
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - stock-buddy-net

  stock-buddy-data-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-buddy-mcp:latest
    container_name: stock-buddy-data-mcp
    command: ['node', 'packages/data-mcp-server/dist/server.js']
    ports:
      - '8081:8081'
    environment:
      - DATABASE_URL=postgresql://stockbuddy:stockbuddy@postgres:5432/stockbuddy
      - STOCK_BUDDY_DATA_HTTP=1
      - STOCK_BUDDY_DATA_PORT=8081
      - STOCK_BUDDY_DATA_ADMIN=1
      - STOCK_BUDDY_SKILLS_DIR=/app/skills
      - STOCK_BUDDY_SKILLS_ADMIN=1
      - STOCK_BUDDY_SKILLS_WRITE_DISK=1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./skills:/app/skills
    restart: unless-stopped
    networks:
      - stock-buddy-net

  ingest-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-buddy-mcp:latest
    container_name: stock-buddy-ingest
    command: ['node', 'packages/ingest/dist/scheduler.js']
    environment:
      - DATABASE_URL=postgresql://stockbuddy:stockbuddy@postgres:5432/stockbuddy
      - INGEST_DAILY_OHLCV_DAYS=90
      - INGEST_OHLCV_SOURCES=dse,stockanalysis,yahoo
      - INGEST_FUNDAMENTALS_SOURCES=dse,stockanalysis,stockanalysis_statistics,lankabd,amarstock
      - INGEST_NEWS_SOURCES=dse_psn,dse_corporate,tbs_stocks,dhaka_tribune_stock,tbs_economy,financial_express,google_news_dse,daily_star_business,tbs_economy_bn,prothomalo,google_news_bn,financial_express_bn
      - INGEST_SOURCE_RATE_MS=1000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stock-buddy-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-buddy-mcp:latest
    container_name: stock-buddy-dashboard
    command: ['node', 'packages/dashboard/dist/server.js']
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://stockbuddy:stockbuddy@postgres:5432/stockbuddy
      - STOCK_BUDDY_DASHBOARD_PORT=3000
      - STOCK_BUDDY_SKILLS_DIR=/app/skills
      - STOCK_BUDDY_SKILLS_WRITE_DISK=1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./skills:/app/skills
      - ./packages/skills/dist:/app/packages/skills/dist:ro
      - ./packages/mcp-server/dist:/app/packages/mcp-server/dist:ro
      - ./packages/ingest/dist:/app/packages/ingest/dist:ro
      - ./packages/db/dist:/app/packages/db/dist:ro
      - ./packages/core/dist:/app/packages/core/dist:ro
      - ./packages/dashboard/public:/app/packages/dashboard/public:ro
      - ./packages/dashboard/dist:/app/packages/dashboard/dist:ro
    restart: unless-stopped
    networks:
      - stock-buddy-net

volumes:
  pgdata:

networks:
  stock-buddy-net:
    driver: bridge
