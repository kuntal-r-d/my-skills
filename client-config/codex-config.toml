# Docker stdio MCP — same as Claude Desktop.
# Merge into ~/.codex/config.toml or project .codex/config.toml
# Prerequisites: docker compose build; ensure data/stockbuddy.sqlite exists (migrate + seed or adopt)

[mcp_servers.stock-buddy-data]
command = "docker"
args = [
  "run", "-i", "--rm",
  "-v", "${HOME}/Developer/projects/stock-buddy-skill-mcp/stock-buddy/data:/data",
  "-e", "STOCK_BUDDY_DATA_HTTP=0",
  "-e", "DATABASE_URL=file:/data/stockbuddy.sqlite",
  "-e", "STOCK_BUDDY_DATA_ADMIN=1",
  "stock-buddy-mcp:latest",
  "node", "packages/data-mcp-server/dist/server.js",
]
enabled = true

[mcp_servers.stock-buddy]
command = "docker"
args = [
  "run", "-i", "--rm",
  "-v", "${HOME}/Developer/projects/stock-buddy-skill-mcp/stock-buddy/data:/data",
  "-e", "STOCK_BUDDY_HTTP=0",
  "-e", "DATABASE_URL=file:/data/stockbuddy.sqlite",
  "-e", "STOCK_BUDDY_SKILLS_DIR=/app/skills",
  "stock-buddy-mcp:latest",
]
enabled = true
